meta:
  country: "ch"
  year: 2026
  currency: "CHF"
  version: "1.0.1"
  sources:
    - url: "https://www.estv.admin.ch/estv/en/home/federal-direct-tax.html"
      description: "Swiss Federal Tax Administration (ESTV) - Direct Federal Tax overview"
      retrieved_at: "2026-03-07"
    - url: "https://swisstaxcalculator.estv.admin.ch/"
      description: "Official ESTV tax calculator for federal, cantonal, and municipal taxes"
      retrieved_at: "2026-03-07"
    - url: "https://bl-api.webcloud7.ch/politik-und-behorden/direktionen/finanz-und-kirchendirektion/steuerverwaltung/steuerzahlungen/tarife-1/tarife-pdf/tarife-direkte-bundessteuer-2026.pdf/@@download/file/Tarife%20Direkte%20Bundessteuer%202026.pdf"
      description: "Official 2026 Swiss Federal Tax Rate Tables (PDF) - direct federal tax brackets"
      retrieved_at: "2026-03-07"
    - url: "https://www.bsv.admin.ch/bsv/de/home/sozialversicherungen/ahv/grundlagen-gesetze/ahv-beitragssaetze.html"
      description: "Official BSV AHV/IV/EO contribution rates (5.3% employee share, unchanged for 2026)"
      retrieved_at: "2026-03-07"
    - url: "https://www.bsv.admin.ch/dam/de/sd-web/G-958u9abUZ4/ALV_AC_Neuerungen.pdf"
      description: "Official BSV ALV timeline: the solidarity contribution (1% on wages above the CHF 148,200 ceiling) automatically expired by law on 1.1.2023 (AVIG Art. 90a) and has not been reinstated. ALV employee rate is 1.1% up to the CHF 148,200 cap; no contribution above the cap."
      retrieved_at: "2026-07-13"
    - url: "https://www.efd.admin.ch/de/newnsb/VzaAUrhkPx2EPde4a6e3O"
      description: "EFD: Cold progression adjustment for 2026 federal tax brackets (0.1% inflation adjustment)"
      retrieved_at: "2026-03-07"
    - url: "https://www.zh.ch/content/dam/zhweb/bilder-dokumente/themen/steuern-finanzen/steuern/natuerlichepersonen/2026/est-wegleitungen-uj/305%20Wegleitung%20ZH%202026%20UJ%20bf.pdf"
      description: "Canton Zurich 2026 tax return guide - confirms married deduction CHF 2,800"
      retrieved_at: "2026-03-07"
    - url: "https://www.bsv.admin.ch/dam/de/sd-web/sAgdISSXenMT/d_Betr%C3%A4ge%202026.pdf"
      description: "Official BSV circular 'Beträge gültig ab dem 1. Januar 2026' - BVG entry threshold CHF 22,680, coordination deduction CHF 26,460, max annual salary CHF 90,720, min/max coordinated salary CHF 3,780/CHF 64,260 (all unchanged from 2025)"
      retrieved_at: "2026-07-13"
    - url: "https://www.fedlex.admin.ch/eli/cc/1983/797_797_797/de"
      description: "BVG statute (SR 831.40) - Art. 16 age-banded credit rates (25-34: 7%, 35-44: 10%, 45-54: 15%, 55-65: 18%); Art. 66 employer-at-least-half parity rule"
      retrieved_at: "2026-07-13"
    - url: "https://www.kmu.admin.ch/kmu/de/home/praktisches-wissen/personal/personalmanagement/pflichten-der-arbeitgebenden/sozialversicherungen/uvg-und-nbu.html"
      description: "Swiss SME portal - confirms NBU premiums are employee-paid and capped at the CHF 148,200 max insured salary (same as UVG/ALV)"
      retrieved_at: "2026-07-13"
  updated_at: "2026-07-13"
  notes: |
    Switzerland has a complex three-level tax system: federal, cantonal, and municipal.
    Federal tax rates are progressive up to 11.5% maximum.
    Cantonal and municipal taxes vary significantly by location, using multiplier systems.
    This configuration provides federal taxes and example cantonal rates for major cantons.

    Key updates for 2026:
    - Federal tax brackets adjusted for cold progression (0.1% inflation): top threshold for
      singles rises from CHF 783,300 to CHF 793,800; married from CHF 895,000 to CHF 941,200.
    - Married couple deduction (Verheiratetenabzug) increased from CHF 2,600 to CHF 2,800.
    - AHV/IV/EO contribution rate unchanged at 5.3% (employee share).
    - ALV (unemployment insurance) rate unchanged at 1.1% up to CHF 148,200 cap.
    - Standard professional expense deductions (Berufskosten) unchanged due to minimal inflation.
    - Cantonal multipliers carried forward from 2025 data (minimal year-to-year variation).
    - Added NBU (non-occupational accident insurance, representative 1% employee rate) and BVG
      (occupational pension, statutory-minimum age-banded employee contribution on the coordinated
      salary) as mandatory payroll deductions. See the nbu_bvg_representative notice for the
      documented assumptions (representative NBU rate; 50/50 employer/employee BVG split).

notices:
  - id: "multi_level_taxation"
    title: "Three-Level Tax System"
    body: |
      Switzerland taxes income at three levels: federal, cantonal (state), and municipal (city).
      Total tax burden varies significantly by location. This calculator includes federal tax
      and representative canton/municipal rates. Your actual tax may differ based on your
      specific municipality within the canton.
    severity: "info"

  - id: "social_security"
    title: "Social Security Contributions"
    body: |
      Swiss employees contribute to AVS/AI/APG (old-age, disability, loss of income) at 5.3%
      and unemployment insurance (ALV) at 1.1% up to CHF 148,200 annual income. There is no
      ALV contribution on income above this cap; the former ALV solidarity contribution was
      abolished by law effective 1 January 2023. NBU (accident insurance) and BVG (occupational
      pension) contributions are also included - see the NBU & BVG notice below.
    severity: "info"

  - id: "nbu_bvg_representative"
    title: "NBU & BVG - Representative Mandatory Minimums"
    body: |
      NBU (non-occupational accident insurance) is employee-paid and mandatory for anyone
      working 8+ hours/week, but the exact rate is set per insurer/branch by Suva or a private
      insurer. This calculator uses 1% as a representative, commonly-cited figure; your actual
      payslip deduction may differ (documented range roughly 0.5%-2%).

      BVG (2nd pillar occupational pension) shown here is the STATUTORY MINIMUM employee
      contribution only (Art. 16 BVG age-banded credit rates of 7/10/15/18% of coordinated
      salary), assuming a 50/50 employer/employee split of the total credit (Art. 66 BVG only
      guarantees the employer pays at least half). Many pension plans, especially at larger or
      more generous employers, contribute above the legal minimum, which would lower your own
      deduction relative to what is modeled here.
    severity: "info"

  - id: "cantonal_approximation"
    title: "Cantonal Tax Approximation"
    body: |
      Cantonal and municipal taxes in Switzerland are complex and vary by canton and municipality.
      This calculator uses simplified progressive bracket approximations for major cantons. Actual
      taxes depend on your specific municipality's tax multiplier (Steuerfuss) and canton's base
      tariff. For precise calculations, consult your canton's official tax calculator.
    severity: "warning"

  - id: "married_filing"
    title: "Married Filing Status"
    body: |
      Switzerland taxes married couples jointly. The combined income is taxed together,
      which may result in higher or lower effective rates depending on income distribution.
    severity: "info"

inputs:
  gross_annual:
    type: number
    required: true
    min: 0
    label: "Annual Gross Salary"
    description: "Your total yearly salary before any deductions (in CHF)"

  filing_status:
    type: enum
    required: true
    default: "single"
    label: "Filing Status"
    options:
      single:
        label: "Single"
        description: "Unmarried individual"
      married:
        label: "Married"
        description: "Married or in registered partnership (joint taxation)"

  age_band:
    type: enum
    required: false
    default: "35_44"
    label: "Age band (for BVG pension contribution)"
    description: "Your age bracket; determines the statutory BVG occupational-pension credit rate"
    options:
      25_34:
        label: "25–34"
      35_44:
        label: "35–44"
      45_54:
        label: "45–54"
      55_65:
        label: "55–65"

  region_level_1:
    type: enum
    required: false
    label: "Canton"
    description: "Select your canton of residence (optional - affects cantonal/municipal tax estimates)"
    options:
      zurich:
        label: "Zürich"
      bern:
        label: "Bern"
      geneva:
        label: "Geneva"
      basel_stadt:
        label: "Basel-Stadt"
      vaud:
        label: "Vaud"
      zug:
        label: "Zug (lowest tax)"
      schwyz:
        label: "Schwyz"
      neuchatel:
        label: "Neuchâtel"

  pillar_3a_contributions:
    type: number
    required: false
    min: 0
    default: 0
    effect: reduces_tax
    label: "Pillar 3a contributions (optional)"
    description: "Voluntary pension savings (3a); deductible up to CHF 7,258 (2026)"

  mortgage_interest_paid:
    type: number
    required: false
    min: 0
    default: 0
    effect: reduces_tax
    label: "Mortgage interest paid (optional)"
    description: "Interest on owner-occupied home loan; cap = investment income + CHF 50,000"

  investment_income_annual:
    type: number
    required: false
    min: 0
    default: 0
    group: mortgage_interest_paid
    label: "Investment income (optional)"
    description: "Taxable investment income; used for mortgage interest deduction cap"

  childcare_costs:
    type: number
    required: false
    min: 0
    default: 0
    effect: reduces_tax
    label: "Childcare costs (optional)"
    description: "Day-care, nanny, etc.; deductible up to CHF 25,000 per child (both parents working)"

  number_of_children_eligible:
    type: number
    required: false
    min: 0
    default: 1
    group: childcare_costs
    label: "Number of children for childcare deduction"
    description: "Children under 14 (or in education) for whom you claim childcare; used for cap"

  medical_expenses:
    type: number
    required: false
    min: 0
    default: 0
    effect: reduces_tax
    label: "Medical expenses (optional)"
    description: "Unreimbursed medical/dental costs; only amount above 5% of income is deductible"

parameters:
  # Social security caps and rates (2026 - unchanged from 2025)
  unemployment_cap: 148200  # CHF 148,200 annual cap for unemployment insurance

  # Social security contribution rates (employee portion only)
  avs_ai_apg_rate: 0.053    # 5.3% for AVS (old-age), AI (disability), APG (loss of income)
  unemployment_rate: 0.011   # 1.1% for ALV (unemployment insurance) up to cap

  # NBU (non-occupational accident insurance) - employee-paid, representative rate.
  # The actual rate is set per insurer/branch by Suva or a private insurer; documented
  # range is roughly 0.5%-2% (up to ~2.4% in high-risk branches). 1% is a commonly cited
  # representative rate for office/service-sector employees. Capped at the same
  # CHF 148,200 max insured salary (Höchstversicherter Verdienst UVG) that also governs ALV.
  nbu_rate: 0.01

  # BVG (occupational pension, 2nd pillar) - statutory minimum figures, 2026 (BSV circular
  # "Beträge gültig ab dem 1. Januar 2026", confirmed unchanged from 2025).
  bvg_entry_threshold: 22680        # Mindestjahreslohn - minimum AHV salary for mandatory BVG enrolment
  bvg_coordination_deduction: 26460 # Koordinationsabzug
  bvg_max_annual_salary: 90720      # Obere Limite des Jahreslohns (cap applied before coordination deduction)
  bvg_min_coordinated_salary: 3780  # Minimaler koordinierter Lohn
  bvg_max_coordinated_salary: 64260 # Maximaler koordinierter Lohn (90720 - 26460)

  # Representative assumption that the employee pays exactly half of the statutory-minimum
  # BVG credit. Art. 66 BVG (collective parity) only requires the employer to pay AT LEAST
  # 50% of the total across all employees - not a universal per-employee mandate.
  bvg_employee_share_rate: 0.5

  # Statutory minimum age-banded BVG credit rates (Art. 16 BVG), % of coordinated salary,
  # combined employer+employee (employee share derived via bvg_employee_share_rate above).
  bvg_age_credit_rate_25_34: 0.07
  bvg_age_credit_rate_35_44: 0.10
  bvg_age_credit_rate_45_54: 0.15
  bvg_age_credit_rate_55_65: 0.18

  # Standard deductions for federal tax calculation (2026)
  # Source: EFD announcement Sept 2025 - deductions unchanged due to 0.1% inflation
  business_expense_deduction_single: 3200    # Max CHF 3,200 for commuting/professional expenses (federal cap)
  business_expense_deduction_married: 3200   # Same cap for married
  insurance_premium_deduction_single: 1800   # CHF 1,800 for insurance premiums (federal)
  insurance_premium_deduction_married: 3600  # CHF 3,600 for married couples (federal)
  married_couple_deduction: 2800             # CHF 2,800 federal married deduction (increased from 2,600 in 2025)

  pillar_3a_cap: 7258
  mortgage_interest_cap_extra: 50000
  childcare_cap_per_child: 25000
  medical_threshold_rate: 0.05

  # Cantonal/municipal tax brackets (progressive rates by income level and canton)
  # Single filers - Zurich
  zurich_single_brackets:
    - threshold: 0
      rate: 0.08
    - threshold: 50000
      rate: 0.12
    - threshold: 150000
      rate: 0.15

  # Married filers - Zurich
  zurich_married_brackets:
    - threshold: 0
      rate: 0.06
    - threshold: 50000
      rate: 0.10
    - threshold: 150000
      rate: 0.13

  # Single filers - Bern (carried forward from 2025)
