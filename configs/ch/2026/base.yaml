  # Married filers - Basel-Stadt
  basel_stadt_married_brackets:
    - threshold: 0
      rate: 0.07
    - threshold: 50000
      rate: 0.11
    - threshold: 150000
      rate: 0.14

  # Single filers - Vaud (carried forward from 2025)
  vaud_single_brackets:
    - threshold: 0
      rate: 0.10
