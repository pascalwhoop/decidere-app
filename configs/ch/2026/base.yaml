calculations:
  # Social security contributions
  - id: avs_ai_apg_contribution
    type: percent_of
    base: "@gross_annual"
    rate: "$avs_ai_apg_rate"
    category: contribution
    label: "AVS/AI/APG Contributions"
    description: "Old-age, disability, and loss of income insurance (5.3%)"

  - id: unemployment_base
    type: min
    values:
      - "@gross_annual"
      - "$unemployment_cap"

  - id: unemployment_contribution
    type: percent_of
    base: "$unemployment_base"
    rate: "$unemployment_rate"
    category: contribution
    label: "Unemployment Insurance (ALV)"
    description: "Unemployment insurance contribution (1.1% up to CHF 148,200)"

  # NBU - Non-Occupational Accident Insurance (employee-paid, representative rate)
  - id: nbu_base
    type: min
    values:
      - "@gross_annual"
      - "$unemployment_cap"

  - id: nbu_contribution
    type: percent_of
    base: "$nbu_base"
    rate: "$nbu_rate"
    category: contribution
    label: "NBU (Non-Occupational Accident Insurance)"
    description: "Non-occupational accident insurance - employee-paid; representative 1% rate (insurer/branch-specific; typical range ~0.5%-2%), capped at CHF 148,200 (same cap as UVG/ALV)."

  # BVG - Occupational Pension (2nd pillar), statutory minimum, employee share
  - id: bvg_capped_gross
    type: min
    values:
      - "@gross_annual"
      - "$bvg_max_annual_salary"

  - id: bvg_coordinated_raw
    type: sub
    values:
      - "$bvg_capped_gross"
      - "$bvg_coordination_deduction"

  - id: bvg_coordinated_salary
    type: clamp
    value: "$bvg_coordinated_raw"
    min: "$bvg_min_coordinated_salary"
    max: "$bvg_max_coordinated_salary"

  - id: bvg_age_credit_rate
    type: switch
    on: "@age_band"
    cases:
      25_34: "$bvg_age_credit_rate_25_34"
      35_44: "$bvg_age_credit_rate_35_44"
      45_54: "$bvg_age_credit_rate_45_54"
      55_65: "$bvg_age_credit_rate_55_65"
      _: "$bvg_age_credit_rate_35_44"

  - id: bvg_total_credit
    type: percent_of
    base: "$bvg_coordinated_salary"
    rate: "$bvg_age_credit_rate"

  - id: bvg_employee_credit_raw
    type: mul
    values:
      - "$bvg_total_credit"
      - "$bvg_employee_share_rate"

  - id: bvg_pension_contribution
    type: conditional
    condition:
      type: gte
      left: "@gross_annual"
      right: "$bvg_entry_threshold"
    then: "$bvg_employee_credit_raw"
    else: 0
    category: contribution
    label: "BVG Occupational Pension (Employee Share)"
    description: "Statutory-minimum occupational pension (2nd pillar) employee contribution on the coordinated salary, using age-banded credit rates (7/10/15/18%) and an assumed 50/50 employer/employee split; only applies once AHV salary reaches CHF 22,680."

  - id: total_social_contributions
    type: sum
    values:
      - "$avs_ai_apg_contribution"
      - "$unemployment_contribution"
      - "$nbu_contribution"
      - "$bvg_pension_contribution"

  # Standard deductions for federal tax calculation
  - id: business_expense_deduction
    type: switch
    on: "@filing_status"
    cases:
      single: "$business_expense_deduction_single"
      married: "$business_expense_deduction_married"
      _: "$business_expense_deduction_single"

  - id: insurance_premium_deduction
    type: switch
    on: "@filing_status"
    cases:
      single: "$insurance_premium_deduction_single"
      married: "$insurance_premium_deduction_married"
      _: "$insurance_premium_deduction_single"

  - id: married_deduction
    type: switch
    on: "@filing_status"
    cases:
      married: "$married_couple_deduction"
      _: 0

  - id: total_standard_deductions
    type: sum
    values:
      - "$business_expense_deduction"
      - "$insurance_premium_deduction"
      - "$married_deduction"

  - id: income_after_social
    type: sub
    values:
      - "@gross_annual"
      - "$total_social_contributions"

  - id: income_before_optional_deductions
    type: sub
    values:
      - "$income_after_social"
      - "$total_standard_deductions"

  - id: pillar_3a_deduction
    type: deduction
    amount: "@pillar_3a_contributions"
    cap: "$pillar_3a_cap"
    category: deduction
    label: "Pillar 3a"

  - id: mortgage_interest_cap
    type: sum
    values:
      - "@investment_income_annual"
      - "$mortgage_interest_cap_extra"

  - id: mortgage_interest_deduction
    type: deduction
    amount: "@mortgage_interest_paid"
    cap: "$mortgage_interest_cap"
    category: deduction
    label: "Mortgage interest"

  - id: childcare_cap
    type: mul
    values:
      - "$childcare_cap_per_child"
      - "@number_of_children_eligible"

  - id: childcare_deduction
    type: deduction
    amount: "@childcare_costs"
    cap: "$childcare_cap"
    category: deduction
    label: "Childcare"

  - id: optional_deductions_before_medical
    type: sum
    values:
      - "$pillar_3a_deduction"
      - "$mortgage_interest_deduction"
      - "$childcare_deduction"

  - id: income_after_non_medical_optionals
    type: sub
    values:
      - "$income_before_optional_deductions"
      - "$optional_deductions_before_medical"

  - id: medical_threshold
    type: mul
    values:
      - "$income_after_non_medical_optionals"
      - "$medical_threshold_rate"

  - id: medical_deduction
    type: deduction
    amount: "@medical_expenses"
    threshold:
      amount: "$medical_threshold"
      mode: "above"
    category: deduction
    label: "Medical expenses"

  - id: total_optional_deductions
    type: sum
    values:
      - "$pillar_3a_deduction"
      - "$mortgage_interest_deduction"
      - "$childcare_deduction"
      - "$medical_deduction"

  - id: taxable_income_federal
    type: sub
    values:
      - "$income_before_optional_deductions"
      - "$total_optional_deductions"

  # Federal income tax (applied to taxable income, not gross)
  - id: federal_tax_brackets
    type: switch
    on: "@filing_status"
    cases:
      single: "$federal_tax_brackets_single"
      married: "$federal_tax_brackets_married"

  - id: federal_income_tax
    type: bracket_tax
    base: "$taxable_income_federal"
    brackets: "$federal_tax_brackets"
    category: income_tax
    label: "Federal Income Tax"
    description: "Swiss direct federal tax (progressive up to 11.5%)"

  # Cantonal/municipal tax brackets
  - id: cantonal_brackets
    type: switch
    on: "@region_level_1"
    cases:
      zurich:
        type: switch
        on: "@filing_status"
        cases:
          single: "$zurich_single_brackets"
          married: "$zurich_married_brackets"
          _: "$zurich_single_brackets"
      bern:
        type: switch
        on: "@filing_status"
        cases:
          single: "$bern_single_brackets"
          married: "$bern_married_brackets"
          _: "$bern_single_brackets"
      basel_stadt:
        type: switch
        on: "@filing_status"
        cases:
          single: "$basel_stadt_single_brackets"
          married: "$basel_stadt_married_brackets"
          _: "$basel_stadt_single_brackets"
      vaud:
        type: switch
        on: "@filing_status"
        cases:
          single: "$vaud_single_brackets"
          married: "$vaud_married_brackets"
          _: "$vaud_single_brackets"
      schwyz:
        type: switch
        on: "@filing_status"
        cases:
          single: "$schwyz_single_brackets"
          married: "$schwyz_married_brackets"
          _: "$schwyz_single_brackets"
      zug:
        type: switch
        on: "@filing_status"
        cases:
          single: "$zug_single_brackets"
          married: "$zug_married_brackets"
          _: "$zug_single_brackets"
      geneva:
        type: switch
        on: "@filing_status"
        cases:
          single: "$geneva_single_brackets"
          married: "$geneva_married_brackets"
          _: "$geneva_single_brackets"
      neuchatel:
        type: switch
        on: "@filing_status"
        cases:
          single: "$neuchatel_single_brackets"
          married: "$neuchatel_married_brackets"
          _: "$neuchatel_single_brackets"
      _:  # Default to Zurich (respecting filing status) when no canton selected
        type: switch
        on: "@filing_status"
        cases:
          single: "$zurich_single_brackets"
          married: "$zurich_married_brackets"
          _: "$zurich_single_brackets"

  # Cantonal/municipal tax - Progressive brackets for correct marginal rate calculation
  # IMPORTANT: Cantonal taxes are applied progressively (marginal rates), not as flat rate on entire income
  # This avoids discontinuities at bracket thresholds

  - id: cantonal_municipal_tax
    type: bracket_tax
    base: "@gross_annual"
    brackets: "$cantonal_brackets"
    category: income_tax
    label: "Cantonal & Municipal Tax"
    description: "Combined cantonal and municipal income tax (progressive marginal rates by canton and filing status)"

  # Total taxes and deductions
  - id: total_income_tax
    type: sum
    values:
      - "$federal_income_tax"
      - "$cantonal_municipal_tax"

  - id: total_deductions
    type: sum
    values:
      - "$total_income_tax"
      - "$total_social_contributions"

  - id: net_annual
    type: sub
    values:
      - "@gross_annual"
      - "$total_deductions"

outputs:
  gross: "@gross_annual"
  net: "$net_annual"

  effective_rate:
    type: div
    values:
      - type: sub
        values: ["@gross_annual", "$net_annual"]
      - "@gross_annual"

  breakdown:
    taxes:
      - "$federal_income_tax"
      - "$cantonal_municipal_tax"
    contributions:
      - "$avs_ai_apg_contribution"
      - "$unemployment_contribution"
      - "$nbu_contribution"
      - "$bvg_pension_contribution"
    deductions:
      - "$pillar_3a_deduction"
      - "$mortgage_interest_deduction"
      - "$childcare_deduction"
      - "$medical_deduction"
