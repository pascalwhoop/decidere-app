      description: "ONSS administrative instructions 2026/1, employee social security contribution rates"
      retrieved_at: "2026-05-26"
    - url: "https://www.socialsecurity.be/employer/instructions/dmfa/fr/latest/instructions/deductions/workers_reductions/workbonus.html"
      description: "ONSS administrative instructions 2026/1, employee work bonus reduction"
      retrieved_at: "2026-05-26"
    - url: "https://www.socialsecurity.be/employer/instructions/dmfa/fr/latest/instructions/special_contributions/other_specialcontributions/specialsocialsecuritycontribution.html"
      description: "ONSS administrative instructions 2026/1, special social security contribution withholding"
      retrieved_at: "2026-05-26"
    - url: "https://www.bdo.be/en-gb/insights/news-alerts/2026/key-figures-indexed-amounts-of-income-tax-for-the-2025-2026-2027-tax-year"
      description: "Indexed 2026 Belgian tax amounts including child allowance and flat-rate professional expenses cap"
      retrieved_at: "2026-05-26"
    - url: "https://www.wikifin.be/nl/belasting-werk-en-inkomen/belastingaangifte/belastingverminderingen/pensioensparen"
      description: "Wikifin pension savings tax reduction limits for the 2026 Belgian tax return"
      retrieved_at: "2026-05-26"
    - url: "https://emploi.belgique.be/fr/titres-repas"
      description: "FPS Employment 2026 meal voucher employer and employee contribution limits"
      retrieved_at: "2026-05-26"
    - url: "https://fin.belgium.be/fr/particuliers/declaration-impot/revenus/voitures-de-societe"
      description: "FPS Finance company car taxable benefit formula and 2026 minimum benefit"
      retrieved_at: "2026-05-26"
    - url: "https://www.bdo.be/en-gb/insights/news-alerts/2026/mobility-budget-2026-what-your-company-needs-to-know"
      description: "Belgian mobility budget 2026 tax treatment and pillar 3 contribution"
      retrieved_at: "2026-05-26"
    - url: "https://fin.belgium.be/sites/default/files/media/documents/taux-taxe-communale-2026.pdf"
      description: "FPS Finance official 2026 municipal personal income tax surcharge rates by commune"
      retrieved_at: "2026-05-26"
  updated_at: "2026-05-26"
  notes: |
    Belgium 2026 standard resident employee salary calculation.

    This model covers regular private-sector employees declared at 100% gross salary
    and calculates employee-side ordinary social security, the low-wage work bonus,
    flat-rate professional expenses, federal personal income tax, a configurable
    municipal surcharge, and the payroll withholding estimate for the special social
    security contribution.

    Key assumptions and limitations:
    - Single regular employment income only; no spouse income, replacement income,
      bonuses with special withholding, or full tax-return optimization.
    - Municipal surcharge defaults to 7%, close to a common Belgian local tax rate,
      but municipalities vary.
    - The special social security contribution is modeled using ONSS employer
      withholding bands for a stable monthly salary. Final annual reconciliation is
      household-based and can differ.
    - The employee work bonus is annualized from the 2026/1 monthly ONSS formula for
      full-time white-collar employees. It is capped at ordinary employee social
      security due.
    - Company cars are modeled from the annual taxable benefit shown by the employer
      or calculated separately. This calculator does not derive the benefit from car
      catalogue value, age, fuel type, and CO2.
    - Housing and mortgage benefits are modeled as a direct regional tax-reduction
      input because Belgian housing tax benefits depend on region, loan date, dwelling
      status, and legacy regime.

notices:
  - id: "municipal_tax"
    title: "Municipal Surcharge"
    body: |
      Belgian resident income tax includes a municipal surcharge. This calculator
      defaults to 7%, but actual commune rates vary.
    severity: "info"

  - id: "special_social_security"
    title: "Special Social Security Contribution"
    body: |
      The special social security contribution is estimated from ONSS payroll
      withholding bands for stable monthly pay. The final annual amount is reconciled
      on household income and may differ from payroll withholding.
    severity: "warning"

  - id: "salary_scope"
    title: "Regular Employee Salary"
    body: |
      This configuration models regular employee salary and common benefits. It does
      not include spouse income, bonuses with special withholding, replacement income,
      or full tax-return optimization.
    severity: "info"

