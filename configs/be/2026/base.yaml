    zwevegem: 0.0750

  employee_social_security_rate: 0.1307
  months_per_year: 12
  quarters_per_year: 4

  income_tax_brackets:
    - threshold: 0
      rate: 0.25
    - threshold: 16720
      rate: 0.40
    - threshold: 29510
      rate: 0.45
    - threshold: 51070
      rate: 0.50

  tax_free_allowance_brackets:
    - threshold: 0
      rate: 0.25
    - threshold: 11750
      rate: 0.30
    - threshold: 16720
      rate: 0.40
    - threshold: 27860
      rate: 0.45
    - threshold: 51070
      rate: 0.50

  tax_free_allowance_base: 11180
  child_allowance_one: 2130
  child_allowance_two: 5230
  child_allowance_three: 11720
  child_allowance_four: 18970
  child_allowance_each_above_four: 7240

  professional_expenses_rate: 0.30
  professional_expenses_cap: 6070

  work_bonus_a_low_salary_limit: 2777.83
  work_bonus_a_upper_salary_limit: 3271.48
  work_bonus_a_max: 120.59
  work_bonus_a_reduction_rate: 0.2443
  work_bonus_b_low_salary_limit: 2175.25
  work_bonus_b_upper_salary_limit: 2777.83
  work_bonus_b_max: 162.62
  work_bonus_b_reduction_rate: 0.2699

  special_ssc_q1_threshold: 5836.14
  special_ssc_q2_threshold: 6570.54
  special_ssc_q3_threshold: 11211
  special_ssc_q4_threshold: 12300
  special_ssc_q5_threshold: 18000
  special_ssc_monthly_q1_threshold: 1945.38
  special_ssc_monthly_q2_threshold: 2190.18
  special_ssc_monthly_q3_threshold: 3737
  special_ssc_monthly_q4_threshold: 4100
  special_ssc_q2_base: 30.99
  special_ssc_q3_base: 82.05
  special_ssc_q4_base: 118.83
  special_ssc_q5_base: 182.82
  special_ssc_rate_q1: 0.0422
  special_ssc_rate_q2: 0.0110
  special_ssc_rate_q3: 0.0338
  special_ssc_rate_q4: 0.0600

  pension_savings_standard_cap: 1050
  pension_savings_standard_rate: 0.30
  pension_savings_increased_cap: 1350
  pension_savings_increased_rate: 0.25

  service_voucher_flanders_credit_per_voucher: 1.80
  service_voucher_flanders_cap: 198
  service_voucher_wallonia_rate: 0.10
  service_voucher_wallonia_cap: 150
  service_voucher_brussels_rate: 0
  mobility_budget_cash_contribution_rate: 0.3807

calculations:
  - id: monthly_gross
    type: div
    values:
      - "@gross_annual"
      - "$months_per_year"

  - id: quarterly_gross
    type: div
    values:
      - "@gross_annual"
      - "$quarters_per_year"

  - id: ordinary_social_security_gross
    type: percent_of
    base: "@gross_annual"
    rate: "$employee_social_security_rate"

  - id: work_bonus_a
    type: conditional
    condition:
      type: lte
      left: "$monthly_gross"
      right: "$work_bonus_a_low_salary_limit"
    then: "$work_bonus_a_max"
    else:
      type: conditional
      condition:
        type: lte
        left: "$monthly_gross"
        right: "$work_bonus_a_upper_salary_limit"
      then:
        type: max
        values:
          - 0
          - type: sub
            values:
              - "$work_bonus_a_max"
              - type: mul
                values:
                  - "$work_bonus_a_reduction_rate"
                  - type: sub
                    values:
                      - "$monthly_gross"
                      - "$work_bonus_a_low_salary_limit"
      else: 0

  - id: work_bonus_b
    type: conditional
    condition:
      type: lte
      left: "$monthly_gross"
      right: "$work_bonus_b_low_salary_limit"
    then: "$work_bonus_b_max"
    else:
      type: conditional
      condition:
        type: lte
        left: "$monthly_gross"
        right: "$work_bonus_b_upper_salary_limit"
      then:
        type: max
        values:
          - 0
          - type: sub
            values:
              - "$work_bonus_b_max"
              - type: mul
                values:
                  - "$work_bonus_b_reduction_rate"
                  - type: sub
                    values:
                      - "$monthly_gross"
                      - "$work_bonus_b_low_salary_limit"
      else: 0

  - id: work_bonus_annual_uncapped
    type: mul
    values:
      - type: sum
        values:
          - "$work_bonus_a"
          - "$work_bonus_b"
      - "$months_per_year"

  - id: work_bonus_annual
    type: min
    values:
      - "$work_bonus_annual_uncapped"
      - "$ordinary_social_security_gross"
    category: credit
    label: "Work Bonus"
    description: "Low-wage reduction of employee social security contributions"

  - id: employee_social_security
    type: sub
    values:
      - "$ordinary_social_security_gross"
      - "$work_bonus_annual"
    category: contribution
    label: "Employee Social Security (ONSS/RSZ)"
    description: "13.07% ordinary employee contribution after work bonus"

  - id: inbound_tax_free_allowance
    type: identity
    value: 0
    category: deduction
    label: "Inbound Tax-Free Allowance"
    description: "Tax-free employer expense allowance under an approved inbound taxpayer/researcher regime"

  - id: taxable_before_expenses
    type: sub
    values:
      - type: sum
        values:
          - "@gross_annual"
          - "@company_car_taxable_benefit"
      - "$employee_social_security"

  - id: professional_expenses
    type: min
    values:
      - type: percent_of
        base: "$taxable_before_expenses"
        rate: "$professional_expenses_rate"
      - "$professional_expenses_cap"
    category: deduction
    label: "Flat-Rate Professional Expenses"
    description: "30% flat-rate employee professional expenses capped at EUR 6,070"

  - id: taxable_income
    type: sub
    values:
      - "$taxable_before_expenses"
      - "$professional_expenses"

  - id: child_allowance
    type: conditional
    condition:
      type: gt
      left: "@dependent_children"
      right: 4
    then:
      type: sum
      values:
        - "$child_allowance_four"
        - type: mul
          values:
            - type: sub
              values:
                - "@dependent_children"
                - 4
            - "$child_allowance_each_above_four"
    else:
      type: switch
      on: "@dependent_children"
      cases:
        "0": 0
        "1": "$child_allowance_one"
        "2": "$child_allowance_two"
        "3": "$child_allowance_three"
        "4": "$child_allowance_four"
      default: 0

  - id: tax_free_allowance
    type: sum
    values:
      - "$tax_free_allowance_base"
      - "$child_allowance"

  - id: gross_income_tax
    type: bracket_tax
    base: "$taxable_income"
    brackets: "$income_tax_brackets"

  - id: tax_free_allowance_tax_value
    type: bracket_tax
    base: "$tax_free_allowance"
    brackets: "$tax_free_allowance_brackets"
    category: credit
    label: "Tax-Free Allowance"
    description: "Tax reduction for the Belgian personal tax-free allowance"

  - id: pension_savings_cap
    type: switch
    on: "@pension_savings_scheme"
    cases:
      standard: "$pension_savings_standard_cap"
      increased: "$pension_savings_increased_cap"
    default: "$pension_savings_standard_cap"

  - id: pension_savings_rate
    type: switch
    on: "@pension_savings_scheme"
    cases:
      standard: "$pension_savings_standard_rate"
      increased: "$pension_savings_increased_rate"
    default: "$pension_savings_standard_rate"

  - id: pension_savings_eligible
    type: min
    values:
      - "@pension_savings_contributions"
      - "$pension_savings_cap"

  - id: pension_savings_tax_reduction
    type: percent_of
    base: "$pension_savings_eligible"
    rate: "$pension_savings_rate"
    category: credit
    label: "Pension Savings Tax Reduction"
    description: "Federal tax reduction for eligible pension savings contributions"

  - id: service_voucher_cap
    type: switch
    on: "@service_voucher_region"
    cases:
      flanders: "$service_voucher_flanders_cap"
      wallonia: "$service_voucher_wallonia_cap"
      brussels: 0
    default: "$service_voucher_flanders_cap"

  - id: service_vouchers_eligible
    type: min
    values:
      - "@service_vouchers_purchased"
      - "$service_voucher_cap"

  - id: service_voucher_tax_reduction
    type: switch
    on: "@service_voucher_region"
    cases:
      flanders:
        type: mul
        values:
          - "$service_vouchers_eligible"
          - "$service_voucher_flanders_credit_per_voucher"
      wallonia:
        type: mul
        values:
          - "$service_vouchers_eligible"
          - "@service_voucher_price"
          - "$service_voucher_wallonia_rate"
      brussels: 0
    default: 0
    category: credit
    label: "Service Voucher Tax Reduction"
    description: "Regional tax reduction for eligible household service vouchers"

  - id: regional_housing_tax_reduction_applied
    type: min
    values:
      - "@regional_housing_tax_reduction"
      - type: max
        values:
          - 0
          - type: sub
            values:
              - "$gross_income_tax"
              - type: sum
                values:
                  - "$tax_free_allowance_tax_value"
                  - "$pension_savings_tax_reduction"
                  - "$service_voucher_tax_reduction"
    category: credit
    label: "Mortgage/Housing Tax Reduction"
    description: "Regional housing or mortgage tax reduction applied against income tax"

  - id: income_tax_before_municipal
    type: max
    values:
      - 0
      - type: sub
        values:
          - "$gross_income_tax"
          - type: sum
            values:
              - "$tax_free_allowance_tax_value"
              - "$pension_savings_tax_reduction"
              - "$service_voucher_tax_reduction"
              - "$regional_housing_tax_reduction_applied"

  - id: selected_municipality_tax_rate
    type: lookup
    table: "$municipality_tax_rates"
    key: "@municipality"
    default: 0

  - id: municipal_tax
    type: percent_of
    base: "$income_tax_before_municipal"
    rate: "$selected_municipality_tax_rate"
    category: surtax
    label: "Municipal Surcharge"
    description: "Local surcharge on personal income tax"

  - id: income_tax
    type: sum
    values:
      - "$income_tax_before_municipal"
      - "$municipal_tax"
    category: income_tax
    label: "Personal Income Tax"
    description: "Federal income tax after tax-free allowance, plus municipal surcharge"

  - id: special_ssc_quarterly
    type: conditional
    condition:
      type: lte
      left: "$quarterly_gross"
      right: "$special_ssc_q1_threshold"
    then: 0
    else:
      type: conditional
      condition:
        type: lte
        left: "$quarterly_gross"
        right: "$special_ssc_q2_threshold"
      then:
        type: mul
        values:
          - 3
          - "$special_ssc_rate_q1"
          - type: sub
            values:
              - "$monthly_gross"
              - "$special_ssc_monthly_q1_threshold"
      else:
        type: conditional
        condition:
          type: lte
          left: "$quarterly_gross"
          right: "$special_ssc_q3_threshold"
        then:
          type: sum
          values:
            - "$special_ssc_q2_base"
            - type: mul
              values:
                - 3
                - "$special_ssc_rate_q2"
                - type: sub
                  values:
                    - "$monthly_gross"
                    - "$special_ssc_monthly_q2_threshold"
        else:
          type: conditional
          condition:
            type: lte
            left: "$quarterly_gross"
            right: "$special_ssc_q4_threshold"
          then:
            type: sum
            values:
              - "$special_ssc_q3_base"
              - type: mul
                values:
                  - 3
                  - "$special_ssc_rate_q3"
                  - type: sub
                    values:
                      - "$monthly_gross"
                      - "$special_ssc_monthly_q3_threshold"
          else:
            type: conditional
            condition:
              type: lte
              left: "$quarterly_gross"
              right: "$special_ssc_q5_threshold"
            then:
              type: sum
              values:
                - "$special_ssc_q4_base"
                - type: mul
                  values:
                    - 3
                    - "$special_ssc_rate_q4"
                    - type: sub
                      values:
                        - "$monthly_gross"
                        - "$special_ssc_monthly_q4_threshold"
            else: "$special_ssc_q5_base"

  - id: special_social_security
    type: mul
    values:
      - "$special_ssc_quarterly"
      - "$quarters_per_year"
    category: contribution
    label: "Special Social Security Contribution"
    description: "Estimated ONSS payroll withholding for the special social security contribution"

  - id: meal_voucher_net_benefit
    type: mul
    values:
      - "@meal_vouchers_per_year"
      - type: max
        values:
          - 0
          - type: sub
            values:
              - "@meal_voucher_value"
              - "@meal_voucher_employee_contribution"
    category: credit
    label: "Meal Voucher Net Benefit"
    description: "Tax-exempt meal voucher purchasing power after employee contribution"

  - id: mobility_budget_cash_contribution
    type: percent_of
    base: "@mobility_budget_cash"
    rate: "$mobility_budget_cash_contribution_rate"
    category: contribution
    label: "Mobility Budget Cash Contribution"
    description: "38.07% special contribution on mobility budget cash payout"

  - id: mobility_budget_cash_net
    type: sub
    values:
      - "@mobility_budget_cash"
      - "$mobility_budget_cash_contribution"

  - id: tax_free_benefits
    type: sum
    values:
      - "$meal_voucher_net_benefit"
      - "@mobility_budget_pillar2"
      - "$mobility_budget_cash_net"
    category: credit
    label: "Tax-Free Benefits"
    description: "Meal vouchers and mobility budget benefits paid outside taxable cash salary"

  - id: total_deductions
    type: sum
    values:
      - "$employee_social_security"
      - "$special_social_security"
      - "$income_tax"

  - id: net_annual
    type: sub
    values:
      - type: sum
        values:
          - "@gross_annual"
          - "$tax_free_benefits"
      - "$total_deductions"

outputs:
  gross: "@gross_annual"
  net: "$net_annual"
  effective_rate:
    type: div
    values:
      - "$total_deductions"
      - "@gross_annual"
  breakdown:
    taxes:
      - "$income_tax"
    contributions:
      - "$employee_social_security"
      - "$special_social_security"
      - "$mobility_budget_cash_contribution"
    credits:
      - "$work_bonus_annual"
      - "$tax_free_allowance_tax_value"
      - "$pension_savings_tax_reduction"
      - "$service_voucher_tax_reduction"
      - "$regional_housing_tax_reduction_applied"
      - "$meal_voucher_net_benefit"
      - "$tax_free_benefits"
    deductions:
      - "$professional_expenses"
      - "$inbound_tax_free_allowance"
    surtaxes:
      - "$municipal_tax"
