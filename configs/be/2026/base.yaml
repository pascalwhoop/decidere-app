  dependent_children:
    type: number
    required: false
    min: 0
    max: 10
    default: 0
    effect: reduces_tax
    label: "Dependent Children"
    description: "Number of dependent children for the increase in tax-free allowance"

  pension_savings_contributions:
    type: number
    required: false
    min: 0
    default: 0
    effect: reduces_tax
    label: "Pension Savings Contributions"
    description: "Annual personal pension savings payments eligible for the federal tax reduction"

  pension_savings_scheme:
    type: enum
    required: false
    default: "standard"
    label: "Pension Savings Scheme"
    description: "Belgian pension savings has a 30% reduction at the standard cap or 25% at the higher cap"
    options:
      standard:
        label: "Standard cap"
        description: "30% tax reduction, capped at EUR 1,050"
      increased:
        label: "Increased cap"
        description: "25% tax reduction, capped at EUR 1,350"

  service_voucher_region:
    type: enum
    required: false
    default: "flanders"
    label: "Service Voucher Region"
    description: "Region of residence for service voucher tax reduction"
    options:
      flanders:
        label: "Flanders"
        description: "Flemish service voucher tax reduction"
      wallonia:
        label: "Wallonia"
        description: "Walloon service voucher tax reduction"
      brussels:
        label: "Brussels"
        description: "No tax reduction for vouchers bought from 2026"

  service_vouchers_purchased:
    type: number
    required: false
    min: 0
    default: 0
    effect: reduces_tax
    label: "Service Vouchers Purchased"
    description: "Number of eligible household-service vouchers bought during the year"

  service_voucher_price:
    type: number
    required: false
    min: 0
    default: 10
    label: "Service Voucher Price"
    description: "Price paid per service voucher"

  regional_housing_tax_reduction:
    type: number
    required: false
    min: 0
    default: 0
    effect: reduces_tax
    label: "Mortgage/Housing Tax Reduction"
    description: "Annual regional housing or mortgage tax reduction from your certificate or prior assessment"

  company_car_taxable_benefit:
    type: number
    required: false
    min: 0
    default: 0
    effect: increases_tax
    label: "Company Car Taxable Benefit"
    description: "Annual taxable benefit in kind for private use of a company car, after any personal contribution"

  meal_vouchers_per_year:
    type: number
    required: false
    min: 0
    max: 260
    default: 0
    effect: reduces_tax
    label: "Meal Vouchers Per Year"
    description: "Number of meal vouchers received for days actually worked"

  meal_voucher_value:
    type: number
    required: false
    min: 0
    max: 10
    default: 10
    label: "Meal Voucher Face Value"
    description: "Face value per voucher, capped at EUR 10 for the favorable 2026 regime"

  meal_voucher_employee_contribution:
    type: number
    required: false
    min: 0
    max: 10
    default: 1.09
    label: "Meal Voucher Employee Contribution"
    description: "Employee contribution per voucher; the favorable regime requires at least EUR 1.09"

  mobility_budget_pillar2:
    type: number
    required: false
    min: 0
    default: 0
    effect: reduces_tax
    label: "Mobility Budget Pillar 2"
    description: "Tax-free mobility budget used for sustainable mobility or eligible housing costs"

  mobility_budget_cash:
    type: number
    required: false
    min: 0
    default: 0
    effect: reduces_tax
    label: "Mobility Budget Cash"
    description: "Unspent mobility budget paid out in cash; subject to the 38.07% special contribution"

